name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-advanced.txt -r requirements-control.txt customtkinter
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q assistant.py config.py providers.py gui.py main.py core memory tools integrations voice packaging
