name: Build Android APK (Kivy)

on:
  workflow_dispatch:
  push:
    branches: [android-kivy]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython<3.0"

      - name: Prepare android source tree
        run: |
          cd android
          for d in core memory intelligence tools integrations voice capabilities devices retrieval security audit diagnostics; do
            if [ -d "../$d" ]; then
              cp -a "../$d" .
            fi
          done
          for f in assistant.py config.py providers.py requirements.txt; do
            if [ -f "../$f" ]; then
              cp "../$f" .
            fi
          done
          ls -la

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          # Non-interactive license acceptance
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # Also write the standard accepted marker files if present
          if [ -d "$ANDROID_HOME/licenses" ]; then
            echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          fi

      - name: Build debug APK
        working-directory: android
        run: buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 30
