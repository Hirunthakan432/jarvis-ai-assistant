name: Build installers
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/installers-*']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Linux build and runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk portaudio19-dev libespeak1 xvfb
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: Freeze desktop app
        run: python -m PyInstaller --clean --noconfirm packaging/jarvis.spec
      - name: Smoke test Linux bundle
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/Jarvis/Jarvis --smoke-test
      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarvis/Jarvis.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed: $($process.ExitCode)" }
      - name: Build Debian installer
        if: runner.os == 'Linux'
        run: |
          python packaging/build_deb.py
          sudo apt-get install -y ./dist/installers/*.deb
          xvfb-run -a jarvis --smoke-test
          sudo apt-get remove -y jarvis-ai-assistant
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $installer = Get-ChildItem dist/installers/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installation failed' }
          $installed = "$env:LOCALAPPDATA\Programs\Jarvis"
          $process = Start-Process -FilePath "$installed\Jarvis.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed app smoke test failed' }
          $process = Start-Process -FilePath "$installed\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Record resolved dependencies
        run: python -m pip freeze > dist/installers/build-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ runner.os }}-installers
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 30
